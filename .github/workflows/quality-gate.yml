name: HAK V11 Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate source
        run: |
          node --check src/analyzer.js
          node --check src/ruflo-adapter.js
          node --check src/quality-policy.js
          node --check src/quality-gate.js
          node --check bin/hak-gate.js
      - name: Unit tests
        run: npm test
      - name: Scan repository
        run: node bin/hak-quality.js . --out reports
      - name: Verify deterministic gate
        run: |
          node -e 'require("node:fs").writeFileSync("reports/checks.json",JSON.stringify({syntax:"PASS",unit:"PASS"}))'
          node bin/hak-gate.js --report reports/quality-report.json --checks reports/checks.json --policy config/quality-policy.json
      - name: End-to-end acceptance
        run: npm run accept\n      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hak-v11-gate-node-${{ matrix.node }}
          path: reports/
