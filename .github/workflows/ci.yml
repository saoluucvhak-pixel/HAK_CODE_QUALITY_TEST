name: HAK Code Quality CI
on:
  push:
  pull_request:
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Cổng chất lượng (chạy check, test, tự quét)
        run: node bin/hak-quality.js gate --config hak-gate.json --out reports/hak-quality-results.json --commit ${{ github.sha }} --branch ${{ github.ref_name }}
      - name: Lịch sử (trang tĩnh)
        if: always()
        run: node bin/hak-quality.js history reports/quality-report.json reports/hak-quality-results.json --out reports/history.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hak-quality-node-${{ matrix.node }}
          path: reports/
