name: HAK Optional Security Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security-audit.yml'
      - 'src/**'
      - 'bin/**'
      - 'package.json'
      - 'scripts/summarize_semgrep.py'
      - 'tests/test_semgrep_summary.py'
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install 'semgrep>=1.100,<2'
      - name: Test report summarizer
        run: python -m unittest discover -s tests -p 'test_semgrep_summary.py'
      - name: Run Semgrep security rules
        run: semgrep scan --config p/security-audit --error --json --output semgrep-results.json .
      - name: Generate audit summary
        if: always()
        run: |
          if test -f semgrep-results.json; then
            python scripts/summarize_semgrep.py semgrep-results.json --out semgrep-summary.md
          else
            echo 'Semgrep JSON missing; scan did not produce a report.' >&2
            exit 1
          fi
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: |
            semgrep-results.json
            semgrep-summary.md
          if-no-files-found: warn
